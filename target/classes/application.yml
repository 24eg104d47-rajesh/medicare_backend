server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: medicare-ai-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medicare_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:5180,http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads/prescriptions}
  ai:
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
  payment:
    provider: ${PAYMENT_PROVIDER:RAZORPAY_SANDBOX}
    key-id: ${PAYMENT_KEY_ID:rzp_test_medicareai123}
    key-secret: ${PAYMENT_KEY_SECRET:sec_medicareai_secret_123}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:whsec_medicareai_mock}

logging:
  level:
    root: INFO
    com.medicareai: DEBUG
